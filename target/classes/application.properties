spring.application.name=tienda-java-base-original
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cc}?connectionTimeZone=UTC&connectTimeout=5000&socketTimeout=15000}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
server.address=127.0.0.1
server.error.include-message=never
tienda.admin.password=${ADMIN_PASSWORD:admin-demo-2026}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
